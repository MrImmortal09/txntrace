name: Create Android Release (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (none, patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
        - none
        - patch
        - minor
        - major
      track:
        description: 'Play Store Track'
        required: true
        default: 'alpha'
        type: choice
        options:
        - internal
        - alpha
        - beta
        - production

jobs:
  release:
    name: Build & Release Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Configure Git
        if: ${{ github.event.inputs.bump_type != '' && github.event.inputs.bump_type != 'none' }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        if: ${{ github.event.inputs.bump_type != '' && github.event.inputs.bump_type != 'none' }}
        working-directory: ./app
        id: version_bump
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          # The Android and iOS release workflows can run at the same time and both push a
          # bump commit, so always bump on top of the latest remote branch and retry if the
          # push loses the race. Branch and tag are pushed atomically so neither lands alone.
          for attempt in 1 2 3 4 5; do
            git fetch --force --tags origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            npm version "$BUMP_TYPE" --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            git add package.json package-lock.json
            git commit -m "chore(release): bump version to v$NEW_VERSION"
            git tag "v$NEW_VERSION"
            if git push --atomic origin "HEAD:$BRANCH" "refs/tags/v$NEW_VERSION"; then
              echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying on top of latest $BRANCH..."
            git tag -d "v$NEW_VERSION"
            sleep $((attempt * 5))
          done
          echo "Failed to push version bump after 5 attempts" >&2
          exit 1

      - name: Install Dependencies
        working-directory: ./app
        run: npm ci

      - name: Determine Current Version
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          if [ -z "$NEW_VERSION" ]; then
            echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV
          fi
          echo "Building version: ${NEW_VERSION:-$VERSION}"

      - name: Setup Java Jdk
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which no longer exists in
          # cmdline-tools 16+ and makes sdkmanager fail. Gradle fetches platforms/build-tools.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Inject Environment Variables
        working-directory: ./app
        run: |
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Decode Keystore
        working-directory: ./app/android/app
        run: |
          # The keystore is stored as a base64 encoded string in secrets
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > txntrace-release.keystore

      - name: Build Android APK and AAB
        working-directory: ./app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.NEW_VERSION }}
          STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=txntrace-release.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$STORE_PASSWORD" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$KEY_ALIAS" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Extract Release Notes
        id: changelog
        run: |
          set -e
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match="v*" HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          COMMITS=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)")
          echo -e "Changes in this release:\n\n$COMMITS" > release_notes.md

      - name: Create GitHub Release
        id: release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: Release v${{ env.NEW_VERSION }}
          body_path: release_notes.md
          files: |
            app/android/app/build/outputs/apk/release/app-release.apk
            app/android/app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback Release via GitHub CLI
        if: steps.release.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ env.NEW_VERSION }}
        run: |
          set -e
          echo "action-gh-release encountered an issue, falling back to GitHub CLI with retry..."
          for attempt in 1 2 3; do
            echo "Release attempt $attempt..."
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" -F release_notes.md && \
              gh release upload "$TAG" app/android/app/build/outputs/apk/release/app-release.apk app/android/app/build/outputs/bundle/release/app-release.aab --clobber && break
            else
              gh release create "$TAG" app/android/app/build/outputs/apk/release/app-release.apk app/android/app/build/outputs/bundle/release/app-release.aab --title "Release $TAG" -F release_notes.md && break
            fi
            sleep 5
          done

      - name: Upload to Google Play Store
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        if: ${{ env.PLAY_STORE_CREDENTIALS != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          packageName: com.chanakya.txntrace
          releaseFiles: app/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed
