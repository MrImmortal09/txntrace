{% extends "base.html" %}
{% block title %}Import Statement · TxnTrace{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold text-gray-900">Import a statement</h1>
<p class="mt-1 text-sm text-gray-500">Upload a PDF, CSV, or Excel statement, review what was found, then import it.</p>

<div id="upload-card" class="mt-8 rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">
  <div class="grid gap-5 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700">Bank name</label>
      <input id="bank-input" type="text" placeholder="e.g. HDFC Bank"
             class="mt-1.5 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Statement file</label>
      <input id="file-input" type="file" accept=".pdf,.csv,.xls,.xlsx"
             class="mt-1.5 w-full text-sm text-gray-600 file:mr-3 file:rounded-lg file:border-0 file:bg-brand file:px-4 file:py-2 file:text-sm file:font-medium file:text-white hover:file:bg-blue-600" />
    </div>
  </div>

  <button id="parse-btn"
          class="mt-6 rounded-lg bg-brand px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-600 disabled:cursor-not-allowed disabled:opacity-50">
    Parse statement
  </button>
  <p id="upload-error" class="mt-3 hidden text-sm text-debit"></p>
</div>

<div id="review-section" class="mt-10 hidden">
  <div class="flex items-center justify-between">
    <h2 class="text-lg font-semibold text-gray-900">Review <span id="row-count"></span></h2>
    <button id="commit-btn"
            class="rounded-lg bg-credit px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-green-600">
      Import into TxnTrace
    </button>
  </div>

  <div class="mt-4 overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">
        <tr>
          <th class="px-4 py-3">Date</th>
          <th class="px-4 py-3">Description</th>
          <th class="px-4 py-3">Category</th>
          <th class="px-4 py-3 text-right">Amount</th>
          <th class="px-4 py-3 text-center">Details</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody id="review-body" class="divide-y divide-gray-100"></tbody>
    </table>
  </div>
</div>

<div id="success-banner" class="mt-6 hidden rounded-xl bg-green-50 px-5 py-4 text-sm font-medium text-green-800"></div>

<!-- Row detail modal — shows every field the file actually had for this row,
     not just the columns the review table has room for (date/amount/merchant
     alone can hide the real biller name when a statement has several
     description-like columns and the parser picked the less useful one). -->
<div id="detail-overlay" class="fixed inset-0 z-10 hidden items-center justify-center bg-black/40 p-4" onclick="closeRowDetail(event)">
  <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl" onclick="event.stopPropagation()">
    <div class="flex items-start justify-between">
      <h3 id="detail-merchant" class="text-lg font-bold text-gray-900"></h3>
      <button onclick="closeRowDetail()" class="text-gray-400 hover:text-gray-600">✕</button>
    </div>
    <p id="detail-amount" class="mt-1 text-2xl font-bold"></p>
    <dl id="detail-fields" class="mt-5 space-y-2 text-sm"></dl>
    <div class="mt-5 border-t border-gray-100 pt-4">
      <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-gray-400">All fields from the file</p>
      <dl id="detail-raw-fields" class="space-y-2 text-sm"></dl>
    </div>
  </div>
</div>

<script>const CATEGORIES = {{ ['Food', 'Transport', 'Bills', 'Shopping', 'Rent', 'Other'] | tojson }};</script>
<script src="/static/app.js"></script>
{% endblock %}
