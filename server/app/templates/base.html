<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TxnTrace{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            debit: '#FF3B30',
            credit: '#34C759',
            brand: '#007AFF',
          },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
  <nav class="border-b border-gray-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
      <a href="/" class="text-lg font-bold text-gray-900">TxnTrace</a>
      <div class="flex items-center gap-6 text-sm font-medium text-gray-500">
        <a href="/" class="hover:text-gray-900">Import Statement</a>
        <a href="/transactions" class="hover:text-gray-900">Transactions</a>
        <a href="/cards" class="hover:text-gray-900">Cards</a>
        {% if version_info and version_info.commit %}
        <span class="rounded bg-gray-100 px-2 py-1 font-mono text-xs text-gray-400" title="{{ version_info.subject or '' }} · {{ version_info.commit_date or '' }}">
          build {{ version_info.build or '?' }} · {{ version_info.commit }}
        </span>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="mx-auto max-w-5xl px-6 py-10">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
